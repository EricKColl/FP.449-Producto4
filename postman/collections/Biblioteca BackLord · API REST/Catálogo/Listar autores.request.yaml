$kind: http-request
url: "{{baseUrl}}/api/autores"
method: GET
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test("Responde 200", () => pm.response.to.have.status(200));
      pm.test("Devuelve los autores con cuántos libros tienen", () => {
          const autores = pm.response.json();
          pm.expect(autores).to.be.an("array").that.is.not.empty;
          pm.expect(autores[0]).to.include.keys("id", "nombre", "apellidos", "libros");
          pm.expect(autores.map(autor => autor.apellidos)).to.include.members(["Allende", "García Márquez", "Tolkien"]);
          pm.expect(autores.find(autor => autor.apellidos === "García Márquez").libros).to.eql(2);
      });
    language: text/javascript
order: 6000
