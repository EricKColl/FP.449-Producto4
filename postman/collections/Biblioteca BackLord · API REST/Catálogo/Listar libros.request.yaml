$kind: http-request
url: "{{baseUrl}}/api/libros"
method: GET
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test("Responde 200", () => pm.response.to.have.status(200));
      const libros = pm.response.json();
      pm.test("Devuelve el catálogo empezando por 1984", () => {
          pm.expect(libros).to.be.an("array").that.is.not.empty;
          pm.expect(libros[0].titulo).to.eql("1984");
          pm.expect(libros.map(libro => libro.titulo)).to.include.members(["Cien años de soledad", "El hobbit"]);
      });
      pm.test("Cada libro trae título, autores y ejemplares libres", () => {
          libros.forEach(libro => pm.expect(libro).to.include.keys("id", "titulo", "autores", "disponibles"));
      });
    language: text/javascript
order: 1000
