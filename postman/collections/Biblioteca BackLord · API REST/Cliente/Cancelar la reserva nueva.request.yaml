$kind: http-request
url: "{{baseUrl}}/api/user/reservas/{{reservaNuevaId}}"
method: DELETE
auth:
  type: bearer
  credentials:
    token: "{{tokenUsuario}}"
scripts:
  - type: afterResponse
    code: pm.test("Responde 204", () => pm.response.to.have.status(204));
    language: text/javascript
order: 5000
