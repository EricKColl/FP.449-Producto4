$kind: http-request
url: |-
  {{baseUrl}}/api/user/prestamos/{{prestamoActivoId}}/renovac
  ion
method: POST
auth:
  type: bearer
  credentials:
    token: "{{tokenUsuario}}"
scripts:
  - type: afterResponse
    code: "// La primera vez se renueva (200); si ya se renovó en otra ejecución, la API lo explica (409)\r

      pm.test(\"Se renueva, o explica por qué no\", () => pm.expect(pm.response.code).to.be.oneOf([200, 409]));\r

      if (pm.response.code === 200) {\r

      pm.test(\"Queda marcado como renovado\", () => pm.expect(pm.response.json().renovado).to.be.true);\r

      } else {\r

      pm.test(\"Ya se había renovado\", () => pm.expect(pm.response.json().detail).to.include(\"ya se renovó\"));\r

      }"
    language: text/javascript
order: 2000
