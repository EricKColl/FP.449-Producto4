$kind: http-request
url: "{{baseUrl}}/api/user/favoritos"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{tokenUsuario}}"
scripts:
  - type: afterResponse
    code: "pm.test(\"Responde 200\", () => pm.response.to.have.status(200));\r

      pm.test(\"Incluye el favorito nuevo\", () => {\r

      pm.expect(pm.response.json().map(l => l.id)).to.include(4);\r

      });"
    language: text/javascript
order: 8000
