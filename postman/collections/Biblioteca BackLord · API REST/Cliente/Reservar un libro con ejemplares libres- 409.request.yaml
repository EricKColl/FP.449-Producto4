$kind: http-request
name: "Reservar un libro con ejemplares libres: 409"
url: "{{baseUrl}}/api/user/reservas"
method: POST
body:
  type: json
  content: "{\r\n\"libroId\": 6\r\n}"
auth:
  type: bearer
  credentials:
    token: "{{tokenUsuario}}"
scripts:
  - type: afterResponse
    code: "pm.test(\"Responde 409\", () => pm.response.to.have.status(409));\r

      pm.test(\"Explica que se puede pedir prestado\", () =>\r

      pm.expect(pm.response.json().detail).to.include(\"puedes pedirlo prestado\"));"
    language: text/javascript
order: 6000
