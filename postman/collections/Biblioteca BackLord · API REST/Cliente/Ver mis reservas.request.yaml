$kind: http-request
url: "{{baseUrl}}/api/user/reservas"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{tokenUsuario}}"
scripts:
  - type: afterResponse
    code: "pm.test(\"Responde 200\", () => pm.response.to.have.status(200));\r

      pm.test(\"Incluye la reserva nueva\", () => {\r

      const ids = pm.response.json().map(r => r.id);\r

      pm.expect(ids).to.include(Number(pm.collectionVariables.get(\"reservaNuevaId\")));\r

      });"
    language: text/javascript
order: 4000
