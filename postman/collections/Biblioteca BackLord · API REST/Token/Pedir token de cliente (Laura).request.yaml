$kind: http-request
url: "{{baseUrl}}/api/auth/token"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "{{usuarioEmail}}",
      "password": "{{usuarioPassword}}"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test("Responde 200", () => pm.response.to.have.status(200));
      const datos = pm.response.json();
      pm.test("Devuelve un token de USER", () => pm.expect(datos.rol).to.eql("USER"));
      pm.collectionVariables.set("tokenUsuario", datos.token);
    language: text/javascript
order: 2000
