$kind: collection
description: |-
  Comprobaciones de la API REST del Producto 4 (FP065, grupo BackLord).

  Importa también el entorno «Biblioteca · local» y elígelo arriba a la derecha. Ejecuta la colección entera con «Run collection»: la carpeta Token guarda los tokens que usan las demás.

  Documentación: {{baseUrl}}/swagger-ui.html
variables:
  tokenAdmin: ""
  tokenUsuario: ""
scripts:
  - type: http:afterResponse
    code: |-
      // Se comprueba en todas las peticiones de la colección (un 204 no tiene cuerpo)
      if (pm.response.code !== 204) {
          pm.test("Responde en JSON", () => pm.expect(pm.response.headers.get("Content-Type")).to.match(/json/));
      }
      pm.test("Responde en menos de 2 segundos", () => pm.expect(pm.response.responseTime).to.be.below(2000));
    language: text/javascript
