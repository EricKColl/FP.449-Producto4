$kind: http-request
url: "{{baseUrl}}/api/admin/libros"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "isbn": "{{adminLibroIsbn}}",
      "titulo": "FP065 Postman {{adminLibroIsbn}}",
      "editorial": "Pruebas FP065",
      "anioPublicacion": 2026,
      "genero": "Pruebas",
      "ejemplares": 2,
      "autores": [
        3
      ]
    }
auth:
  type: bearer
  credentials:
    token: "{{tokenAdmin}}"
scripts:
  - type: beforeRequest
    code: |-
      pm.variables.set("adminLibroId", "");
      pm.variables.set("adminLibroIsbn", "P" + pm.variables.replaceIn("{{$randomUUID}}").replace(/-/g, "").slice(0, 16));
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test("Responde 201", () => pm.response.to.have.status(201));
      const libro = pm.response.json();
      const location = pm.response.headers.get("Location");
      if (pm.response.code === 201 && Number.isSafeInteger(libro.id) && libro.id > 0 &&
          libro.isbn === pm.variables.get("adminLibroIsbn") &&
          libro.titulo === pm.variables.replaceIn("FP065 Postman {{adminLibroIsbn}}")) {
          pm.variables.set("adminLibroId", String(libro.id));
      }
      pm.test("Devuelve la ficha del libro creado y su Location", () => {
          pm.expect(libro).to.have.all.keys("id", "isbn", "titulo", "editorial", "anioPublicacion", "genero", "ejemplares", "disponibles", "autores");
          pm.expect(libro.id).to.be.a("number").above(0);
          pm.expect(libro.isbn).to.eql(pm.variables.get("adminLibroIsbn"));
          pm.expect(libro.autores).to.have.lengthOf(1);
          pm.expect(libro.autores[0]).to.include({id: 3});
          pm.expect(libro.titulo).to.eql(pm.variables.replaceIn("FP065 Postman {{adminLibroIsbn}}"));
          pm.expect(libro.ejemplares).to.eql(2);
          pm.expect(libro.disponibles).to.eql(2);
          pm.expect(location).to.eql("/api/libros/" + libro.id);
      });
    language: text/javascript
order: 1000
