$kind: http-request
name: "Libros · ISBN de prueba duplicado: 409"
url: "{{baseUrl}}/api/admin/libros"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "isbn": "{{adminLibroIsbn}}",
      "titulo": "FP065 Postman {{adminLibroIsbn}}",
      "editorial": "Pruebas FP065",
      "anioPublicacion": 2026,
      "genero": "Pruebas",
      "ejemplares": 2,
      "autores": [
        3
      ]
    }
auth:
  type: bearer
  credentials:
    token: "{{tokenAdmin}}"
scripts:
  - type: beforeRequest
    code: |-
      const id = pm.variables.get("adminLibroId");
      if (!/^[1-9]\d*$/.test(String(id)) || !pm.variables.get("adminLibroIsbn")) {
          pm.execution.skipRequest();
      }
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test("Responde 409", () => pm.response.to.have.status(409));
      pm.test("Formato Problem Details", () => {
          pm.expect(pm.response.headers.get("Content-Type")).to.match(/^application\/problem\+json\b/i);
          const error = pm.response.json();
          pm.expect(error).to.include.keys("status", "title", "detail", "instance");
          pm.expect(error.status).to.eql(409);
          pm.expect(error.detail).to.be.a("string").and.not.empty;
      });
      pm.test("Identifica el ISBN duplicado", () => pm.expect(pm.response.json().detail).to.include(pm.variables.get("adminLibroIsbn")));
    language: text/javascript
order: 2000
