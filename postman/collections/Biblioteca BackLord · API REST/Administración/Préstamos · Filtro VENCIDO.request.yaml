$kind: http-request
url: "{{baseUrl}}/api/admin/prestamos?estado=VENCIDO"
method: GET
queryParams:
  estado: VENCIDO
auth:
  type: bearer
  credentials:
    token: "{{tokenAdmin}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Responde 200", () => pm.response.to.have.status(200));
      const prestamos = pm.response.json();
      pm.test("Solo devuelve préstamos abiertos y vencidos", () => {
          pm.expect(prestamos).to.be.an("array");
          prestamos.forEach(prestamo => {
              pm.expect(prestamo.estado).to.eql("VENCIDO");
              pm.expect(prestamo.fechaDevolucion).to.eql(null);
          });
      });
      pm.test("El préstamo sigue el contrato del DTO", () => {
          prestamos.forEach(prestamo => {
              pm.expect(prestamo).to.have.all.keys("id", "libroId", "titulo", "usuarioId", "usuario", "fechaPrestamo", "fechaDevolucionPrevista", "fechaDevolucion", "estado", "renovado");
              pm.expect(prestamo.estado).to.be.oneOf(["ACTIVO", "VENCIDO", "DEVUELTO"]);
              pm.expect(prestamo.renovado).to.be.a("boolean");
          });
      });
    language: text/javascript
order: 11000
