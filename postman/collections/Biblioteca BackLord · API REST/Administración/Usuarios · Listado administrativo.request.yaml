$kind: http-request
url: "{{baseUrl}}/api/admin/usuarios"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{tokenAdmin}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Responde 200", () => pm.response.to.have.status(200));
      pm.test("Cada usuario contiene únicamente los campos administrativos, sin contraseñas ni hashes", () => {
          const usuarios = pm.response.json();
          pm.expect(usuarios).to.be.an("array").that.is.not.empty;
          usuarios.forEach(usuario => {
              pm.expect(usuario).to.have.all.keys("id", "dni", "nombre", "apellidos", "email", "telefono", "rol", "fechaAlta", "prestamosEnCurso", "prestamosVencidos");
              pm.expect(usuario.prestamosVencidos).to.be.a("number").at.least(0);
              pm.expect(usuario.prestamosEnCurso).to.be.a("number").at.least(usuario.prestamosVencidos);
          });
      });
    language: text/javascript
order: 9000
