$kind: http-request
url: "{{baseUrl}}/api/admin/libros/{{adminLibroId}}"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "isbn": "{{adminLibroIsbn}}",
      "titulo": "FP065 Postman editado {{adminLibroIsbn}}",
      "editorial": "Pruebas FP065",
      "anioPublicacion": 2026,
      "genero": "Pruebas",
      "ejemplares": 3,
      "autores": [
        3
      ]
    }
auth:
  type: bearer
  credentials:
    token: "{{tokenAdmin}}"
scripts:
  - type: beforeRequest
    code: |-
      const id = pm.variables.get("adminLibroId");
      if (!/^[1-9]\d*$/.test(String(id)) || !pm.variables.get("adminLibroIsbn")) {
          pm.execution.skipRequest();
      }
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test("Responde 200", () => pm.response.to.have.status(200));
      pm.test("Devuelve los cambios del libro creado en esta ejecución", () => {
          const libro = pm.response.json();
          pm.expect(libro).to.have.all.keys("id", "isbn", "titulo", "editorial", "anioPublicacion", "genero", "ejemplares", "disponibles", "autores");
          pm.expect(libro.id).to.be.a("number").above(0);
          pm.expect(libro.isbn).to.eql(pm.variables.get("adminLibroIsbn"));
          pm.expect(libro.autores).to.have.lengthOf(1);
          pm.expect(libro.autores[0]).to.include({id: 3});
          pm.expect(String(libro.id)).to.eql(pm.variables.get("adminLibroId"));
          pm.expect(libro.titulo).to.eql(pm.variables.replaceIn("FP065 Postman editado {{adminLibroIsbn}}"));
          pm.expect(libro.ejemplares).to.eql(3);
      });
    language: text/javascript
order: 3000
