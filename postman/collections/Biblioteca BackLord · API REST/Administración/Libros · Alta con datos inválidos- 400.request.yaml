$kind: http-request
name: "Libros · Alta con datos inválidos: 400"
url: "{{baseUrl}}/api/admin/libros"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "isbn": "",
      "titulo": "",
      "ejemplares": 0,
      "autores": []
    }
auth:
  type: bearer
  credentials:
    token: "{{tokenAdmin}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Responde 400", () => pm.response.to.have.status(400));
      pm.test("Formato Problem Details", () => {
          pm.expect(pm.response.headers.get("Content-Type")).to.match(/^application\/problem\+json\b/i);
          const error = pm.response.json();
          pm.expect(error).to.include.keys("status", "title", "detail", "instance");
          pm.expect(error.status).to.eql(400);
          pm.expect(error.detail).to.be.a("string").and.not.empty;
      });
      pm.test("Devuelve los cuatro errores de validación", () => {
          pm.expect(pm.response.json().errores).to.include.keys("isbn", "titulo", "ejemplares", "autores");
      });
    language: text/javascript
order: 6000
