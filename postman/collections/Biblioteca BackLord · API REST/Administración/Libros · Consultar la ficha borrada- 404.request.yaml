$kind: http-request
name: "Libros · Consultar la ficha borrada: 404"
url: "{{baseUrl}}/api/libros/{{adminLibroId}}"
method: GET
auth:
  type: noauth
scripts:
  - type: beforeRequest
    code: |-
      const id = pm.variables.get("adminLibroId");
      if (!/^[1-9]\d*$/.test(String(id)) || !pm.variables.get("adminLibroIsbn")) {
          pm.execution.skipRequest();
      }
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test("Responde 404", () => pm.response.to.have.status(404));
      pm.test("Formato Problem Details", () => {
          pm.expect(pm.response.headers.get("Content-Type")).to.match(/^application\/problem\+json\b/i);
          const error = pm.response.json();
          pm.expect(error).to.include.keys("status", "title", "detail", "instance");
          pm.expect(error.status).to.eql(404);
          pm.expect(error.detail).to.be.a("string").and.not.empty;
      });
      pm.test("La ficha borrada ya no existe", () => pm.expect(pm.response.json().detail).to.include(pm.variables.get("adminLibroId")));
      if (pm.response.code === 404) {
          pm.variables.unset("adminLibroId");
          pm.variables.unset("adminLibroIsbn");
      }
    language: text/javascript
order: 5000
