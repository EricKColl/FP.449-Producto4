$kind: http-request
name: "Token de cliente en administración: 403"
url: "{{baseUrl}}/api/admin/usuarios"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{tokenUsuario}}"
scripts:
  - type: afterResponse
    code: pm.test("Responde 403", () => pm.response.to.have.status(403));
    language: text/javascript
order: 2000
